[package]
name = "fs-ssh"
version = "0.1.0"
description = "Cliente SSH/SFTP com identidade visual por conexão"
authors = ["Marco"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "fs_ssh_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

russh = "0.62"
russh-sftp = "2.3"
# ssh-key NÃO entra como dependência direta: o russh fixa `=0.7.0-rc.11` e uma
# segunda cópia do crate faria `HashAlg`/`PublicKey` virarem tipos incompatíveis.
# Tudo vem de `russh::keys::ssh_key`.

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "fs", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
bytes = "1"

rusqlite = { version = "0.40", features = ["bundled", "chrono"] }

serde = { version = "1", features = ["derive"] }
shlex = "1.3"
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.10"
base64 = "0.22"
sha2 = "0.10"
glob = "0.3"
portable-pty = "0.9.0"
tauri-plugin-clipboard-manager = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
